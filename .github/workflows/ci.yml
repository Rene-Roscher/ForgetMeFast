name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only token for every job. No job below needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: composer check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none
        env:
          # Do not let a runner-level variable hide platform mismatches.
          COMPOSER_IGNORE_PLATFORM_REQS: ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Die Seiten-Tests rendern das Vite-Manifest und brauchen deshalb ein Build.
      - run: npm ci --ignore-scripts && npm run build
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer check

  js:
    name: npm run check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check

  e2e:
    name: npm run e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none
        env:
          COMPOSER_IGNORE_PLATFORM_REQS: ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && touch database/database.sqlite && php artisan migrate --force
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: forgetmefast:ci
      - name: Smoke test the container
        run: |
          set -eu
          key="$(docker run --rm forgetmefast:ci php artisan key:generate --show)"
          docker run -d --name fmf -p 127.0.0.1:8080:8080 -e APP_KEY="$key" forgetmefast:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/up && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/up
          page="$(curl -sS -D - -o /dev/null http://127.0.0.1:8080/)"
          echo "$page" | grep -qi "^content-security-policy: default-src 'none'"
          echo "$page" | grep -qi "^cache-control: no-store"
          asset="$(curl -fsS http://127.0.0.1:8080/ | grep -o '/build/assets/app-[^"]*\.js' | head -1)"
          static="$(curl -sS -D - -o /dev/null "http://127.0.0.1:8080${asset}")"
          echo "$static" | grep -qi "^content-security-policy: default-src 'none'"
          echo "$static" | grep -qi "^cache-control: no-store"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/composer.json)" = 404
          test "$(docker exec fmf id -u)" != 0
          # Der Aufräumjob läuft und meldet sich (Herzschlag, den auch der HEALTHCHECK prüft).
          for i in $(seq 1 30); do docker exec fmf test -f /tmp/scheduler.heartbeat && break; sleep 1; done
          docker exec fmf test -f /tmp/scheduler.heartbeat
          docker exec fmf php artisan about --only=environment | grep -qi production
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: forgetmefast:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: publish image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [php, js, e2e, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # nur hier: das Image in die GitHub Container Registry schieben
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  workflow-lint:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: 1.32.0
